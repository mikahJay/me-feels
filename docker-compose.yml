version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mefeels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mefeels_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mefeels}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./service/src/db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mefeels}"]
      interval: 5s
      timeout: 5s
      retries: 5

  service:
    build:
      context: ./service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      SERVICE_PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mefeels}
      POSTGRES_USER: ${POSTGRES_USER:-mefeels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mefeels_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DEV_MODE: ${DEV_MODE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/auth/google/callback}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./service/src:/app/src:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - service

volumes:
  postgres_data:
